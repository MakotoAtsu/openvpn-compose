# Static part of the OpenVPN server configuration.
# entrypoint.sh appends the settings that come from the environment:
#   server <network> <netmask>
#   push "redirect-gateway def1"          (VPN_REDIRECT_GATEWAY=true)
#   push "dhcp-option DNS <ip>"           (one per entry in VPN_DNS)

# The server always listens on 1194 inside the container; VPN_PORT only
# changes the port published on the host (see compose.yaml).
port 1194
proto udp4
dev tun0
topology subnet

ca /etc/openvpn/pki/ca.crt
cert /etc/openvpn/pki/server.crt
key /etc/openvpn/pki/server.key
dh none
tls-crypt /etc/openvpn/pki/tls-crypt.key
remote-cert-tls client

data-ciphers AES-256-GCM:AES-128-GCM
auth SHA256

keepalive 10 120
persist-key
persist-tun
explicit-exit-notify 1

# Drop root once the tunnel and keys are set up.
user nobody
group nobody

verb 3
